name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWARMSCRIBE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build the leader image
        run: docker build -t swarmscribe-leader:e2e -f e2e/compose/Dockerfile .
      - name: Start Postgres, two leader replicas and the proxy
        run: |
          mkdir -p e2e/compose/work/data
          docker compose -f e2e/compose/docker-compose.yml up -d
      - name: Run the scenario (kills leader-1 mid-run)
        run: uv run python e2e/compose/run_e2e.py --replicas 2
      - name: Show every service's logs
        if: failure()
        run: >-
          docker compose -f e2e/compose/docker-compose.yml logs --no-color
          postgres migrate leader-1 leader-2 proxy
      - name: Tear down
        if: always()
        run: docker compose -f e2e/compose/docker-compose.yml down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/console-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: packages/console-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWARMSCRIBE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Playwright's webServer starts the harness from the repository root.
      E2E_HARNESS_COMMAND: uv run python packages/console-web/e2e/harness/serve.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: packages/console-web/package-lock.json
      - name: Install, build and run the end-to-end tests
        working-directory: packages/console-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/console-web/playwright-report
          retention-days: 7

  console-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build the leader image
        run: docker build -t swarmscribe-leader:e2e -f e2e/compose/Dockerfile .
      - name: Build the console image
        run: docker build -t swarmscribe-console:e2e -f docker/console.Dockerfile .
      - name: Check the console image
        run: bash docker/check-console-image.sh swarmscribe-console:e2e
      - name: Write the test CA and certificate
        run: uv run python e2e/console-compose/run_e2e.py certs
      - name: Start Postgres, the stand-in identity provider, two leaders and the console
        run: docker compose -f e2e/console-compose/docker-compose.yml up -d
      - name: Run the scenario (kills leader-a)
        run: uv run python e2e/console-compose/run_e2e.py run
      - name: Show every service's logs
        if: failure()
        run: docker compose -f e2e/console-compose/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f e2e/console-compose/docker-compose.yml --profile tools down -v

  follower-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build the leader image
        run: docker build -t swarmscribe-leader:e2e -f e2e/compose/Dockerfile .
      - name: Build the follower image with tiny.en baked in
        run: >-
          docker build --build-arg MODELS=tiny.en -t swarmscribe-follower:e2e
          --target cpu -f docker/follower.Dockerfile .
      - name: Build the follower image without a model
        run: docker build -t swarmscribe-follower:cpu --target cpu -f docker/follower.Dockerfile .
      - name: Check both follower images
        run: |
          bash docker/check-follower-image.sh swarmscribe-follower:e2e cpu tiny.en
          bash docker/check-follower-image.sh swarmscribe-follower:cpu cpu
      - name: Write the recordings
        run: uv run python e2e/follower-compose/run_e2e.py prepare
      - name: Start Postgres, two leader replicas and the proxy
        run: docker compose -f e2e/follower-compose/docker-compose.yml up -d
      - name: Run the scenario (kills, stops, drains and revokes followers)
        run: uv run python e2e/follower-compose/run_e2e.py run
      - name: Show every service's logs
        if: failure()
        run: >-
          docker compose -f e2e/follower-compose/docker-compose.yml
          --profile followers logs --no-color
      - name: Tear down
        if: always()
        run: >-
          docker compose -f e2e/follower-compose/docker-compose.yml
          --profile followers down -v

  # The cuda image is built and checked for what it holds. It is never RUN on a GPU here:
  # GitHub's runners have none (follower spec, ruling R5). See the F2 outcomes document.
  follower-cuda-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the cuda follower image, without a model
        run: docker build -t swarmscribe-follower:cuda --target cuda -f docker/follower.Dockerfile .
      - name: Check it (cuBLAS loads by name; without a GPU it says so and exits 3)
        run: bash docker/check-follower-image.sh swarmscribe-follower:cuda cuda

  # The follower's tests on Windows: signals, the credential's access control list, the
  # working set, the service's own code and its command run from the real interpreter. No GPU
  # here, and no service control manager: registering, starting and stopping the service is
  # proven by hand (docs/superpowers/plans/2026-10-05-follower-f4-outcomes.md). The contract
  # tests against a real leader (test_real_leader.py) are not part of it: see the pytest step.
  follower-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 3.12 by name: where the runner has no Python of the 3.11 or 3.12 line, uv would fetch
      # the newest, for which the test database (pgserver) has no wheel.
      - run: uv sync --python 3.12
      # test_real_leader.py is left out here: its throwaway Postgres (pgserver) cannot run
      # initdb under the runner's administrator account (it cannot set permissions on its data
      # folder), and a Windows runner has no service containers. It runs on Linux CI and on
      # developers' Windows machines. --ignore, not --deselect: the whole file is skipped
      # without importing it, so nothing of the database kit is loaded.
      - run: uv run pytest packages/follower --ignore=packages/follower/tests/test_real_leader.py

  # The real leader image (docker/leader.Dockerfile), built, checked, then installed with
  # the leader chart on a kind cluster beside the follower chart: a recording is transcribed
  # end to end and the leader is upgraded, with a migration, while requests flow
  # (e2e/leader-kind; docs/superpowers/plans/2026-10-05-leader-chart-outcomes.md).
  leader-kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # GitHub's runners have about 14 GB free; the 20 GB floor is the development machine's.
      FREE_GB_FLOOR: "5"
    steps:
      - uses: actions/checkout@v4
      - name: Check the disk has room
        run: bash docker/check-free-space.sh 5
      - name: Install Helm and kind, checked against pinned SHA-256 sums
        run: |
          # The Helm version is written here once (the sum below belongs to it), as in the
          # `chart` job.
          HELM_VERSION=v4.3.0
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The driver runs this binary by its full path: the runner image has a Helm 3 of
          # its own, which a child process can find first (the `chart` job did, once).
          echo "HELM=$RUNNER_TEMP/bin/helm" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/helm" version --short
          test "$("$RUNNER_TEMP/bin/helm" version --short | cut -d+ -f1)" = "$HELM_VERSION"
          kind version
      - name: Build the leader image
        run: docker build -t swarmscribe-leader:kind -f docker/leader.Dockerfile .
      - name: Check it (a serving leader stays ready on a newer schema; a starting one refuses it)
        run: timeout 300 bash docker/check-leader-image.sh swarmscribe-leader:kind
      - name: Build the next version's image (one more migration; test only)
        run: >-
          docker build -t swarmscribe-leader:kind-next
          --build-arg BASE=swarmscribe-leader:kind
          -f e2e/leader-kind/next.Dockerfile e2e/leader-kind
      - name: Build the follower image with tiny.en baked in
        run: >-
          docker build --build-arg MODELS=tiny.en -t swarmscribe-follower:leader-kind
          --target cpu -f docker/follower.Dockerfile .
      - name: Pull Postgres
        run: docker pull postgres:16
      - name: Create the cluster, load the images, start Postgres
        run: python3 e2e/leader-kind/run_e2e.py up
      - name: Run the scenario (installs both charts, transcribes, upgrades the leader under load)
        run: python3 e2e/leader-kind/run_e2e.py run
      - name: Show the cluster
        if: failure()
        env:
          KUBECONFIG: e2e/leader-kind/work/kubeconfig
        run: |
          kubectl -n swarmscribe-e2e get pods,jobs,endpointslices,networkpolicy,pdb -o wide || true
          kubectl -n swarmscribe-e2e get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n swarmscribe-e2e describe pods -l app.kubernetes.io/instance=leader | tail -80 || true
          for pod in $(kubectl -n swarmscribe-e2e get pods -o name); do
            echo "=== $pod"; kubectl -n swarmscribe-e2e logs "$pod" --all-containers --tail=60 || true
          done
      - name: Delete the cluster
        if: always()
        run: python3 e2e/leader-kind/run_e2e.py down || true

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Helm and kubeconform, checked against pinned SHA-256 sums
        run: |
          # The one place the Helm version is written (the sum below belongs to it). The
          # render checks read it too and refuse any other Helm (deploy/helm/helm_tool.py).
          HELM_VERSION=v4.3.0
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Every step below runs both tools by their full paths, never "whichever is first
          # on the PATH": the runner image has a Helm of its own.
          echo "HELM=$RUNNER_TEMP/bin/helm" >> "$GITHUB_ENV"
          echo "HELM_VERSION=$HELM_VERSION" >> "$GITHUB_ENV"
          echo "KUBECONFORM=$RUNNER_TEMP/bin/kubeconform" >> "$GITHUB_ENV"
      - name: Show every helm on the PATH and check the one the job runs
        run: |
          echo "PATH=$PATH"
          for found in $(type -ap helm); do echo "$found: $("$found" version --short 2>&1)"; done
          # What a `uv run` child finds first was not what this shell finds first: on the
          # runner it was /usr/local/bin/helm, the image's Helm 3. Show both.
          uv run --no-project python -c "import os, shutil, sys; print('under uv run: python', sys.executable, '| helm', shutil.which('helm')); print('under uv run: PATH=' + os.environ['PATH'])"
          echo "HELM=$HELM: $("$HELM" version --short)"
          test "$("$HELM" version --short | cut -d+ -f1)" = "$HELM_VERSION"
      - name: Lint the console chart
        run: >-
          "$HELM" lint deploy/helm/swarmscribe-console
          -f deploy/helm/swarmscribe-console/ci/test-values.yaml --strict
      - name: Validate the console chart's manifests against the Kubernetes schemas
        run: |
          "$HELM" template console deploy/helm/swarmscribe-console --namespace fleet \
            -f deploy/helm/swarmscribe-console/ci/test-values.yaml > "$RUNNER_TEMP/rendered.yaml"
          "$KUBECONFORM" -strict -summary -kubernetes-version 1.33.0 "$RUNNER_TEMP/rendered.yaml"
      - name: Check what the console chart renders
        run: >-
          uv run --no-project --with pyyaml
          python deploy/helm/swarmscribe-console/ci/check_render.py
      - name: Lint the follower chart, as a CPU pool and as a GPU pool
        run: |
          "$HELM" lint deploy/helm/swarmscribe-follower \
            -f deploy/helm/swarmscribe-follower/ci/test-values.yaml --strict
          "$HELM" lint deploy/helm/swarmscribe-follower \
            -f deploy/helm/swarmscribe-follower/ci/test-values.yaml \
            -f deploy/helm/swarmscribe-follower/ci/gpu-values.yaml --strict
      - name: Validate the follower chart's manifests against the Kubernetes schemas
        run: |
          "$HELM" template pool deploy/helm/swarmscribe-follower --namespace transcribe \
            -f deploy/helm/swarmscribe-follower/ci/test-values.yaml > "$RUNNER_TEMP/follower-cpu.yaml"
          "$HELM" template pool deploy/helm/swarmscribe-follower --namespace transcribe \
            -f deploy/helm/swarmscribe-follower/ci/test-values.yaml \
            -f deploy/helm/swarmscribe-follower/ci/gpu-values.yaml > "$RUNNER_TEMP/follower-gpu.yaml"
          "$KUBECONFORM" -strict -summary -kubernetes-version 1.33.0 \
            "$RUNNER_TEMP/follower-cpu.yaml" "$RUNNER_TEMP/follower-gpu.yaml"
      - name: Check what the follower chart renders
        run: >-
          uv run --no-project --with pyyaml
          python deploy/helm/swarmscribe-follower/ci/check_render.py
      - name: Lint the leader chart
        run: >-
          "$HELM" lint deploy/helm/swarmscribe-leader
          -f deploy/helm/swarmscribe-leader/ci/test-values.yaml --strict
      - name: Validate the leader chart's manifests against the Kubernetes schemas
        run: |
          "$HELM" template leader deploy/helm/swarmscribe-leader --namespace swarmscribe \
            -f deploy/helm/swarmscribe-leader/ci/test-values.yaml > "$RUNNER_TEMP/leader.yaml"
          "$KUBECONFORM" -strict -summary -kubernetes-version 1.33.0 "$RUNNER_TEMP/leader.yaml"
      - name: Check what the leader chart renders
        run: >-
          uv run --no-project --with pyyaml
          python deploy/helm/swarmscribe-leader/ci/check_render.py
