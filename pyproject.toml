[project]
name = "swarmscribe"
version = "0.1.0"
description = "Distributed leader/follower transcription"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
swarmscribe-protocol = { workspace = true }
swarmscribe-engine = { workspace = true }
swarmscribe-leader = { workspace = true }
swarmscribe-console = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "swarmscribe-protocol",
    "swarmscribe-engine",
    "swarmscribe-leader",
    "swarmscribe-console",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pgserver>=0.1",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not smoke'"
markers = [
    "smoke: downloads and runs a real Whisper model; run with: uv run pytest -m smoke",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "packages/leader/src/swarmscribe_leader/db/migrations/versions",
    "packages/console/src/swarmscribe_console/db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
