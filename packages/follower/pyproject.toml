[project]
name = "swarmscribe-follower"
version = "0.1.0"
description = "SwarmScribe follower: takes recordings from a leader and transcribes them"
requires-python = ">=3.11"
dependencies = [
    "swarmscribe-protocol",
    "swarmscribe-engine",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2.4,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
# The GPU library CTranslate2 loads by name at the first inference (follower spec D15).
cuda = [
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
swarmscribe-follower = "swarmscribe_follower.entry:run"

[tool.uv.sources]
swarmscribe-protocol = { workspace = true }
swarmscribe-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmscribe_follower"]
