[project]
name = "swarmscribe-engine"
version = "0.1.0"
description = "SwarmScribe single-file transcription engine"
requires-python = ">=3.11"
# faster-whisper 1.2.1 passes metadata_errors= to av.open, which av 19 removed;
# lift this bound when faster-whisper supports av 19.
dependencies = ["faster-whisper>=1.1,<2", "av>=18,<19"]

[project.scripts]
swarmscribe-engine = "swarmscribe_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmscribe_engine"]
